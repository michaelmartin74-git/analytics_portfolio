version: 2

models:
  - name: stg_fda__food_enforcements
    description: "Staging model for FDA food enforcement recalls with parsed dates and quantities."
    columns:
      - name: recall_sk
        description: "{{ doc('column_recall_sk') }}"
        tests:
          - unique
          - not_null

      - name: affected_product_quantity
        description: "{{ doc('column_affected_product_quantity') }}"

      - name: affected_amount
        description: "{{ doc('column_affected_amount') }}"

      - name: affected_amount_unit_type
        description: "{{ doc('column_affected_amount_unit_type') }}"

      - name: product_sk
        description: "{{ doc('column_product_sk') }}"        