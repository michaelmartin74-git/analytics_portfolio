version: 2

# Try using these source definitions instead!
sources:
  - name: fda_food
    database: bigquery-public-data
    schema: fda_food
    description: Public datasets available through BigQuery
    tables:
      - name: food_enforcement
        description: One record per recall recorded by the US FDA.

        config:
          loaded_at_field: "CAST(report_date AS TIMESTAMP)"

          freshness:
            warn_after:
              count: 7
              period: day
            error_after:
              count: 14
              period: day

        columns:
          - name: classification
            description: >
              Numerical designation (I, II, or III) assigned by FDA indicating health hazard severity.
              Class I = High risk (serious injury/death).
              Class II = Moderate risk (temporary/slight health threat).
              Class III = Low risk (unlikely adverse health reaction, minor violations).

          - name: center_classification_date
            description: ""

          - name: report_date
            description: "Date the FDA issued the enforcement report for the product recall."
            data_tests:
              - not_null

          - name: postal_code
            description: ""

          - name: termination_date
            description: ""

          - name: recall_initiation_date
            description: "Date the firm first began notifying the public or consignees of the recall."

          - name: recall_number
            description: "Numerical designation assigned by FDA to a specific recall event for tracking."

          - name: city
            description: "The city where the recalling firm is located."

          - name: event_id
            description: "Numerical designation assigned by FDA to a specific recall event for tracking."
            data_tests:
              - not_null

          - name: distribution_pattern
            description: "General area of initial distribution (e.g., states, countries, or nationwide)."

          - name: recalling_firm
            description: "The firm that initiates or holds primary responsibility for the recalled product."

          - name: voluntary_mandated
            description: "Indicates whether the recall was firm-initiated (voluntary) or ordered by the FDA (mandated)."

          - name: state
            description: "The U.S. state where the recalling firm is located."

          - name: reason_for_recall
            description: "Description of how the product is defective and violates statutes."

          - name: initial_firm_notification
            description: "Method(s) used by the firm to initially notify consignees or the public."

          - name: status
            description: "Recall status: On-Going (in progress), Completed (retrieved/corrected), Terminated (FDA closed), or Pending (classification in progress)."
            data_tests:
              - accepted_values: 
                  arguments:
                    values: ['Terminated','Ongoing','Completed']

          - name: product_type
            description: ""

          - name: country
            description: "The country where the recalling firm is located."

          - name: product_description
            description: "Brief description of the product being recalled."

          - name: code_info
            description: "Lot/serial numbers, expiration dates, or codes appearing on the product/labeling."

          - name: address_1
            description: ""

          - name: address_2
            description: ""

          - name: product_quantity
            description: "The amount of defective product subject to recall."

          - name: more_code_info
            description: ""

