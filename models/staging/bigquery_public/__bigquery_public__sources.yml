version: 2

sources:
  - name: fda_food
    database: bigquery-public-data
    schema: fda_food
    description: "{{ doc('source_fda_food') }}"
    tables:
      - name: food_enforcement
        description: "{{ doc('table_food_enforcement') }}"

        config:
          loaded_at_field: "CAST(report_date AS TIMESTAMP)"

          freshness:
            warn_after:
              count: 7
              period: day
            error_after:
              count: 14
              period: day

        columns:
          - name: classification
            description: "{{ doc('column_classification') }}"

          - name: report_date
            description: "{{ doc('column_report_date') }}"
            data_tests:
              - not_null

          - name: recall_initiation_date
            description: "{{ doc('column_recall_initiation_date') }}"

          - name: recall_number
            description: "{{ doc('column_recall_number') }}"

          - name: city
            description: "{{ doc('column_city') }}"

          - name: event_id
            description: "{{ doc('column_event_id') }}"
            data_tests:
              - not_null

          - name: distribution_pattern
            description: "{{ doc('column_distribution_pattern') }}"

          - name: recalling_firm
            description: "{{ doc('column_recalling_firm') }}"

          - name: voluntary_mandated
            description: "{{ doc('column_voluntary_mandated') }}"

          - name: state
            description: "{{ doc('column_state') }}"

          - name: reason_for_recall
            description: "{{ doc('column_reason_for_recall') }}"

          - name: initial_firm_notification
            description: "{{ doc('column_initial_firm_notification') }}"

          - name: status
            description: "{{ doc('column_status') }}"
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['Terminated', 'Ongoing', 'Completed']

          - name: country
            description: "{{ doc('column_country') }}"

          - name: product_description
            description: "{{ doc('column_product_description') }}"

          - name: code_info
            description: "{{ doc('column_code_info') }}"

          - name: product_quantity
            description: "{{ doc('column_product_quantity') }}"