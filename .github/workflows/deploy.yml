name: Deploy React Dashboard to Pages

on:
  push:
    branches: [ main ]

# Grant permissions required for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python & Enable Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Caches downloaded wheels across workflow runs

      - name: Cache dbt packages
        uses: actions/cache@v4
        with:
          path: dbt_packages
          key: ${{ runner.os }}-dbt-${{ hashFiles('**/packages.yml') }}
          restore-keys: |
            ${{ runner.os }}-dbt-

      - name: Setup Node.js & Enable NPM Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboards/react/recalls-dashboard/package-lock.json

      - name: Install dbt & Generate Docs
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          # Supply the GCP project ID expected by profiles.yml
          DBT_BIGQUERY_PROJECT: ${{ secrets.DBT_BIGQUERY_PROJECT }}
          # Optional: add dataset or target if profiles.yml uses them
          DBT_BIGQUERY_DATASET: ${{ secrets.DBT_BIGQUERY_DATASET || 'dev' }}
        run: |
          pip install --no-cache-dir dbt-bigquery
          
          # Only pull packages if dbt_packages wasn't restored or updated
          if [ ! -d "dbt_packages" ]; then
            dbt deps
          fi

          # Handle Service Account key
          echo "$GCP_SA_KEY" > /tmp/gcp_key.json
          export GCP_SA_KEY_PATH="/tmp/gcp_key.json"

          # Generate dbt docs
          dbt docs generate

          # Copy generated artifacts into React public directory
          mkdir -p dashboards/react/recalls-dashboard/public/dbt
          cp target/index.html dashboards/react/recalls-dashboard/public/dbt/
          cp target/manifest.json dashboards/react/recalls-dashboard/public/dbt/
          cp target/catalog.json dashboards/react/recalls-dashboard/public/dbt/

          rm /tmp/gcp_key.json

      - name: Install dependencies & Build React App
        run: |
          cd dashboards/react/recalls-dashboard
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dashboards/react/recalls-dashboard/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4