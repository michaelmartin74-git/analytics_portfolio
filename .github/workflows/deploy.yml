name: Deploy React Dashboard to Pages

on:
  push:
    branches: [ main ]

# Grant permissions required for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt & Generate Docs
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery
          
          # Write service account key to a temporary runner path
          echo "$GCP_SA_KEY" > /tmp/gcp_key.json
          export GCP_SA_KEY_PATH="/tmp/gcp_key.json"
          
          # Generate dbt artifacts (index.html, manifest.json, catalog.json)
          dbt docs generate
          
          # Ensure public/dbt folder exists in React project
          mkdir -p dashboards/react/recalls-dashboard/public/dbt
          
          # Copy artifacts into React's public assets
          cp target/index.html dashboards/react/recalls-dashboard/public/dbt/
          cp target/manifest.json dashboards/react/recalls-dashboard/public/dbt/
          cp target/catalog.json dashboards/react/recalls-dashboard/public/dbt/
          
          # Remove temporary key file
          rm /tmp/gcp_key.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build React App
        run: |
          cd dashboards/react/recalls-dashboard
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Points directly to your built distribution folder
          path: 'dashboards/react/recalls-dashboard/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4