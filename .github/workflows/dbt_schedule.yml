name: dbt Daily & Weekly Refresh

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  dbt_run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install dbt-bigquery pandas pyarrow db-dtypes duckdb google-cloud-bigquery

      - name: Authenticate to BigQuery
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run dbt
        env:
          GCP_SA_KEY_PATH: ${{ steps.auth.outputs.credentials_file_path }}
          DBT_BIGQUERY_PROJECT: ${{ secrets.DBT_BIGQUERY_PROJECT }}
          DBT_BIGQUERY_DATASET: ${{ secrets.DBT_BIGQUERY_DATASET }}
        run: |
          dbt deps --profiles-dir .
          DAY_OF_WEEK=$(date +%u)
          if [ "$DAY_OF_WEEK" -eq 7 ]; then
            echo "Running Sunday Full Refresh..."
            dbt run --full-refresh --profiles-dir .
          else
            echo "Running Daily Incremental Run..."
            dbt run --profiles-dir .
          fi

      - name: Export BigQuery Tables to Parquet
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          DBT_BIGQUERY_PROJECT: ${{ secrets.DBT_BIGQUERY_PROJECT }}
          DBT_BIGQUERY_DATASET: ${{ secrets.DBT_BIGQUERY_DATASET }}
        run: |
          python export_bigquery_tables.py

      - name: Process Parquet to JSON for React Dashboard
        run: |
          python agg_recalls_export_to_json.py

      - name: Commit and Push Updated Data Files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.parquet dashboards/react/recalls-dashboard/public/data/agg_recalls_data.json
          
          # Check if there are changes before committing
          if git diff --staged --quiet; then
            echo "No data changes detected to commit."
          else
            git commit -m "auto: update exported parquet and dashboard JSON files [skip ci]"
            git push
          fi