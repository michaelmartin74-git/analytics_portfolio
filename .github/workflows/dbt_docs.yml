name: Deploy dbt Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt and Adapter
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-bigquery  # Replace dbt-bigquery with your adapter

      - name: Install dbt Dependencies
        run: dbt deps

      - name: Create Minimal dbt Profile
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          analytics_portfolio:
            outputs:
              dev:
                type: bigquery  # Replace with your adapter (e.g., snowflake, postgres)
                method: service-account
                project: dummy-project
                dataset: dummy_dataset
            target: dev
          EOF

      - name: Generate dbt Docs
        run: dbt docs generate --static --empty-catalog

      - name: Generate dbt Docs
        run: dbt docs generate --static

      - name: Rename Static File for Pages
        run: |
          mkdir public
          cp target/static_index.html public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4